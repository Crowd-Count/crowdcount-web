    function checkForAlert() {
      fetch('/api/check_if_alert')
          .then(response => response.json())
          .then(data => {
              if (data.is_alert) {
                  fetchAlertDetails();
              }
          })
          .catch(error => console.error('Error checking alert:', error));
    }

    function fetchAlertDetails() {
      fetch('/api/get_active_alert')
          .then(response => response.json())
          .then(data => {
              if (data.alert_info) {
                  showAlert(data.alert_info);
              }
          })
          .catch(error => console.error('Error fetching alert details:', error));
    }

    <!-- showAlert("Server Maintenance", "We are currently undergoing server maintenance. None of our systems are currently functional, please be patient while we work to improve your experience.", "warning"); -->

    function showAlert(customTitle, customBody, customType) {
      const alertBox = document.getElementById('alertBox');
      const alertTitle = document.getElementById('alertTitle');
      const alertBody = document.getElementById('alertBody');

      alertTitle.textContent = customTitle;
      alertBody.textContent = customBody;

      // Customize alert appearance based on customType
      if (customType === "warning") {
          alertBox.style.backgroundColor = "#ff3a30"; // orange: #ff9500, red: #ff3a30
          alertBox.style.color = "black";
      } else if (customType === "celebration") {
          alertBox.style.backgroundColor = "#ffcc00"; // yellow
          alertBox.style.color = "black";
      } else if (customType === "info") {
          alertBox.style.backgroundColor = "#007bff"; // blue
          alertBox.style.color = "white";
      } else if (customType === "privacy") {
          alertBox.style.backgroundColor = "#007bff"; // blue
          alertBox.style.color = "white";
      } else if (customType === "terms-of-use") {
        alertBox.style.backgroundColor = "#ff9500"; // orange
        alertBox.style.color = "black";
      } else if (customType === "leaf") {
          alertBox.style.backgroundColor = "#34c759"; // green
          alertBox.style.color = "black";
      } else {
          alertBox.style.backgroundColor = "#333"; // default color
          alertBox.style.color = "white";
      }

      alertBox.classList.remove('hidden');
      
      // Delay the addition of 'show' class to allow for the opacity transition
      setTimeout(() => {
          alertBox.classList.add('show');
      }, 10); // Small delay to trigger the transition
    }
    </script>
